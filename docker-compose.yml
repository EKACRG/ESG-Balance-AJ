services:
  app:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

volumes:
  mysqldata: {}
