version: '3.8'
services:

  app:
    build: .
    ports:
      - "80:80"
    volumes:
      - ./app:/var/www/html
      - ./vhost.conf:/etc/apache2/sites-enabled/000-default.conf
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: 'esamebasi_aj'
      MYSQL_USER: 'aj'
      MYSQL_PASSWORD: 'esamebasi_aj'
      MYSQL_DATABASE: 'esgbalance'
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

volumes:
  mysqldata: {}
