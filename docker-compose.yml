services:
  app:
    build: .
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - ./src:/var/www/html
      - uploads:/var/www/html/uploads
    depends_on:
      - mysql
      - mongodb
    command: bash -c "composer install --working-dir=/var/www/html && apache2-foreground"

  mysql:
    image: mysql:8.0
    env_file:
      - .env
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"

  mongodb:
    image: mongo:6.0
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/var/lib/mongodb

volumes:
  mysqldata: {}
  mongodbdata: {}
  uploads: {}
